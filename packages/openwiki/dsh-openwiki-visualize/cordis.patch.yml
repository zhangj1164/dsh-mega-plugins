# @zhangj1164/dsh-openwiki-visualize bundle patch: inserts the OpenWiki preview
# host service and its browser half into the host composition.
#
# One row, not two. This package owns both halves — the host service is the
# package's plugin body (`lib/index.js`), and the browser half is discovered from
# the same manifest's `dsh.client` declaration and served at
# `<package>/client` -> `lib/client.js`. That is the same shape the reference
# implementation (`dsh-openwiki`) uses, and it is why a bundle layer cannot
# collide with this one: the entry id `openwiki-visualize` has exactly one
# owning bundle, so this plugin installs alongside any other bundle in the suite.
#
# Install into a web profile:
#
#   dsh plugin --profile web add @zhangj1164/dsh-openwiki-visualize
#
# Every value below is a deployment variable with a schema default; a deployment
# overrides only what it needs. See the Config surface in `src/index.ts`.

- insert:
    - id: openwiki-visualize
      name: "@zhangj1164/dsh-openwiki-visualize"
      config:
        # Minimum openwiki the preview will drive. 0.7.2 is the current release
        # and the release whose visualizer routes this plugin's iframe depends
        # on, so it is the floor rather than an arbitrary one.
        minOpenwikiVersion: "0.7.2"
        # The DSH release whose right-Sidebar tab registry this plugin targets.
        minDshVersion: "0.2.1-rc.2"
        # Directory `openwiki visualize` defaults to, relative to the workspace.
        wikiDirName: openwiki
        # The visualizer's own preferred port; it increments on conflict.
        defaultPort: 4321
        # How many ports to consider past the preferred one.
        portAttempts: 20
        # Where the update check asks for the latest published version.
        registryUrl: https://registry.npmjs.org
        # Check once when the plugin starts.
        updateCheckOnStart: true
