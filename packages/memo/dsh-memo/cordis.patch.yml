# dsh-memo bundle patch: inserts the memo suite host services and the
# browser UI plugin into the host composition. The telemetry service is a
# separate bundle (dsh-telemetry); install it alongside this bundle.
#
# `dsh-github-issue` also ships its own bundle now. This patch still inserts it
# so an existing deployment keeps working unchanged. A bundle layer cannot
# remove an insert from an earlier layer: enabling `dsh-github-issue` as well
# would make two layers insert the id `github-issue`, and the loader rejects a
# duplicate entry id. The two are mutually exclusive — use `not both`.
# `dsh-memo` and `dsh-github-issue` each record this exclusion, and the
# `verify-bundle-entries` gate fails if either stops saying so.

- insert:
    - id: github-issue
      name: dsh-github-issue
      config:
        repoUrl: https://github.com/zhangj1164/dsh-mega-plugins

    - id: memo
      name: dsh-memo
      config:
        repoUrl: https://github.com/zhangj1164/dsh-mega-plugins
        # provider/model are intentionally unset: the service follows this
        # deployment's agentDefaultModel selection. Pin them here to retarget
        # memo AI analysis to a specific route, e.g. provider: cu

    # Browser UI: the memo settings section in the Settings panel.
    - id: ui-memo
      name: dsh-client-ui-memo
