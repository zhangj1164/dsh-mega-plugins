# dsh-memo bundle patch: inserts the memo host service and the memo browser UI
# into the host composition. The memo service injects the `telemetry` and
# `githubIssue` services, which are owned by their own bundles — install this
# bundle with `dsh-telemetry` and `dsh-github-issue`:
#
#   dsh plugin --profile web add dsh-telemetry dsh-github-issue dsh-memo dsh-client-ui-memo
#
# Those two rows are deliberately NOT inserted here. A bundle layer cannot
# remove an insert from an earlier layer and the loader rejects a duplicate
# entry id outright, so a bundle that repeats a row another bundle owns makes
# the natural "install everything" command a boot failure. One entry id has
# exactly one owning bundle; that is what lets any subset of the suite be
# installed together. `pnpm run verify-bundle-entries` fails on any workspace
# bundle that inserts an id another workspace bundle already inserts.

- insert:
    - id: memo
      name: dsh-memo
      config:
        repoUrl: https://github.com/zhangj1164/dsh-mega-plugins
        # provider/model are intentionally unset: the service follows this
        # deployment's agentDefaultModel selection. Pin them here to retarget
        # memo AI analysis to a specific route, e.g. provider: cu

    # Browser UI: the memo settings section in the Settings panel.
    - id: ui-memo
      name: dsh-client-ui-memo
