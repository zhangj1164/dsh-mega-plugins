name: Verify translation pairing

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh.md'
      - 'packages/**/README.md'
      - 'packages/**/README.zh.md'
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.zh.md'
      - 'packages/**/README.md'
      - 'packages/**/README.zh.md'

permissions:
  contents: read

jobs:
  verify:
    name: Bilingual README consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-translation-pairing
