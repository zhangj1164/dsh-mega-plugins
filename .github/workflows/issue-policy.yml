name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        if: ${{ github.event_name != 'issues' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
      - name: Validate issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_PROJECT_TOKEN: ${{ secrets.DSH_MEGA_PLUGINS_ISSUE_TOKEN }}
          DSH_PROJECT_GATE: ${{ vars.DSH_MEGA_PLUGINS_PROJECT_GATE }}
        run: node .github/issue-management/policy.mjs issue
