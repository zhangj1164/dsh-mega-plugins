name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # The only automatic trigger is the nightly window: 16:00-21:59 UTC is
    # 00:00-05:59 Asia/Shanghai. GitHub runs cron on the default branch only.
    - cron: "0 16-21 * * *"
  # There is no push trigger on purpose. Merging ordinary pull requests to main
  # is the normal way work lands, and triggering on every such merge would spend
  # LLM tokens on a wiki refresh each time; the nightly run picks the changes up
  # instead. openwiki/** must never trigger a run either: the update pull
  # request this workflow opens only touches those paths, so a trigger there
  # would merge, push to main, start another run and open another pull request
  # — forever.

permissions:
  actions: read
  contents: write
  pull-requests: write

# A manual run can overlap the scheduled one, and both publish to the same
# openwiki/update branch; serialize them so the second waits instead of
# overwriting the first mid-flight.
concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  # GitHub queues scheduled runs and can deliver them hours late (observed: a run
  # scheduled for 08:00 UTC started at 17:08 UTC), so the cron hour alone cannot
  # keep the refresh in the night window. This gate rejects a delayed run that
  # arrives outside 00:00-05:59 Asia/Shanghai, and rejects a run that lands
  # within six hours of the previous one. A manual dispatch skips both checks: a
  # maintainer asking for a refresh gets one.
  window:
    name: Check the update window
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
    steps:
      - name: Decide whether this run may update the wiki
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            echo "Manual run: the night-window check does not apply."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(date -u +%H)
          if [ "$hour" -lt 16 ] || [ "$hour" -gt 21 ]; then
            echo "Outside 16:00-21:59 UTC (now $(date -u +%H:%M UTC)), skipping this run."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          recent=$(gh api "repos/${{ github.repository }}/actions/workflows/openwiki-update.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select((.created_at | fromdateiso8601) > (now - 21600))] | length")
          echo "Runs in the last six hours: $recent"
          if [ "$recent" -gt 0 ]; then
            echo "Another run happened within the last six hours, skipping this run."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

  update:
    name: Update the wiki
    needs: window
    if: needs.window.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.9.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'deepseek-flash' }}
          OPENWIKI_OPENAI_COMPATIBLE_STREAMING: "true"
          # Required for the LangSmith connector's code-mode pull to authenticate.
          # For extra workspaces, add OPENWIKI_LANGSMITH_API_KEY_2, _3, ... as repo
          # secrets and env entries here.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          # Tracing only works with a real key. Enabled without one, the LangSmith
          # exporter posts to the multipart ingestion endpoint unauthenticated and
          # the resulting 401 fails the run before any page is written. Typical log:
          # Failed to send multipart request. Received status [401]: Unauthorized.
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGSMITH_API_KEY != '' }}

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() }}
        # CLAUDE.md is listed only when present: git add fails on a missing path
        # and then stages nothing.
        run: |
          paths=openwiki,AGENTS.md,.github/workflows/openwiki-update.yml
          if [ -e CLAUDE.md ]; then paths="$paths,CLAUDE.md"; fi
          echo "list=$paths" >> "$GITHUB_OUTPUT"

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: ${{ steps.paths.outputs.list }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
