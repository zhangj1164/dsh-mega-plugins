name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    runs-on: ubuntu-latest
    # The whole job writes the Project board, so it runs only once the
    # project-scoped token is configured. A secret cannot appear in a job
    # condition, hence the variable switch beside the secret.
    if: ${{ vars.DSH_MEGA_PLUGINS_PROJECT_GATE == 'true' }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Handle repository event
        if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_PROJECT_TOKEN: ${{ secrets.DSH_MEGA_PLUGINS_ISSUE_TOKEN }}
          DSH_PROJECT_GATE: ${{ vars.DSH_MEGA_PLUGINS_PROJECT_GATE }}
        run: node .github/issue-management/policy.mjs lifecycle
